name: arXiv Radar update and site deploy

# One workflow for the whole site:
# - schedule / manual run: restore full history -> fetch arXiv -> embed -> build site data
#   -> deploy Pages -> publish full history (Hugging Face + GitHub Release `radar-data`).
# - push to main: rebuild and deploy the site from the stored history, no arXiv fetch.
# Generated data is never committed. Only the README status block is.
#
# Requires Settings -> Pages -> Source = "GitHub Actions".

on:
  schedule:
    # 05:00 Beijing time, every day (Friday papers would otherwise fall into a gap).
    - cron: '0 21 * * *'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/arxiv_radar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/daily-arxiv.yml'
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Fetch new arXiv papers (off = only rebuild the site from stored data)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: radar-pages
  cancel-in-progress: false

env:
  # Repository variable, e.g. "your-name/ai-finance-arxiv-radar". Empty = skip Hugging Face.
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  RADAR_RELEASE_TAG: radar-data
  FETCH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fetch) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # README status commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/arxiv_radar/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r scripts/arxiv_radar/requirements.txt
          npm ci

      - name: Make the legacy data branch available for a one-time bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${HF_DATASET_REPO}" ] || gh release view "${RADAR_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "External history exists; legacy branch not needed."
          else
            git fetch --no-tags --depth=1 origin \
              guohao_vitepress:refs/remotes/origin/guohao_vitepress \
              || echo "Legacy branch is not available."
          fi

      - name: Restore full history
        run: npm run arxiv:restore

      - name: Fetch and tag new arXiv papers
        if: env.FETCH == 'true'
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: npm run arxiv:fetch

      - name: Update embeddings (incremental)
        run: npm run arxiv:embeddings

      - name: Build light site data
        run: npm run arxiv:site-data

      - name: Export full history as Parquet
        if: env.FETCH == 'true'
        run: npm run arxiv:export

      - name: Keep the export for the publish job
        if: env.FETCH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: radar-export
          path: data/export/
          retention-days: 7

      - name: Commit README status to main
        if: env.FETCH == 'true'
        shell: bash
        run: |
          npm run arxiv:readme
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README status is already current."
            exit 0
          fi
          git commit -m "docs: sync arXiv radar README status ($(date -u +'%Y-%m-%d'))"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build VitePress site
        run: npm run docs:build

      - name: Check published file sizes
        run: |
          big="$(find docs/.vitepress/dist -type f -size +10M)"
          if [ -n "${big}" ]; then
            echo "::error::Files above 10 MB in the site build:"
            echo "${big}"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-data:
    # Runs beside the deploy: a Hugging Face or Release hiccup must not block the site.
    # The next run restores from whichever copy is newest available; FETCH_DAYS=7 covers gaps.
    needs: build
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fetch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release mirror
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/arxiv_radar/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/arxiv_radar/requirements.txt

      - name: Download export
        uses: actions/download-artifact@v4
        with:
          name: radar-export
          path: data/export/

      - name: Push to Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m scripts.arxiv_radar.data_store push-hf

      - name: Mirror to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RADAR_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RADAR_RELEASE_TAG}" \
              --title "arXiv Radar data" \
              --notes "Full arXiv Radar history (Parquet), refreshed by the daily workflow. Thank you to arXiv for use of its open access interoperability." \
              --latest=false
          fi
          gh release upload "${RADAR_RELEASE_TAG}" data/export/* --clobber

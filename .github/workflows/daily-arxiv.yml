name: Daily arXiv Update

on:
  schedule:
    # Weekdays 05:00 Beijing time = previous day 21:00 UTC, Sun-Thu cron
    - cron: '0 21 * * 0-4'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  update-papers:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: guohao_vitepress
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Python dependencies
        run: pip install -r scripts/arxiv_radar/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Run arXiv radar pipeline
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: npm run arxiv:update

      - name: Commit and push radar data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/papers.json \
            data/stats.json \
            data/embeddings_index.json \
            docs/public/arxiv-data \
            docs/public/arxiv-charts \
            README.md
          if git diff --cached --quiet; then
            echo "No radar changes to commit."
          else
            git commit -m "chore: update arXiv papers for $(date +'%Y-%m-%d')"
            git push origin HEAD:guohao_vitepress
          fi

      - name: Sync README status to main
        shell: bash
        run: |
          main_worktree="$(mktemp -d)"
          trap 'git worktree remove --force "${main_worktree}" || true; rm -rf "${main_worktree}"' EXIT
          git worktree add --detach "${main_worktree}" origin/main
          cp README.md "${main_worktree}/README.md"
          cd "${main_worktree}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README status is already current on main."
          else
            git commit -m "docs: sync arXiv radar README status"
            git push origin HEAD:main
          fi

      # GITHUB_TOKEN-generated pushes do not reliably start other workflows.
      # Publish here as well, so the Radar update and the public site stay in sync.
      - name: Build VitePress site
        run: npm run docs:build

      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/.vitepress/dist
          force_orphan: true

name: arXiv Radar data update

# Data only: restore full history -> fetch arXiv -> LLM tags -> embed -> export
# -> publish full history (GitHub Release `radar-data` + Hugging Face)
# -> rebuild the site from that data (calls deploy-site.yml)
# -> commit the README status block (only after a successful deploy).
#
# The site itself is built and deployed by deploy-site.yml, which also runs on every
# push to main. So this workflow can be disabled without stopping site updates.
# Generated data is never committed. Only the README status block is.
# restore picks the newest of Hugging Face / Release and, if neither has data yet,
# fetches the legacy `guohao_vitepress` branch by itself for a one-time bootstrap.

on:
  schedule:
    # 03:00 UTC (11:00 Beijing), every day: after arXiv's daily announcement
    # (20:00 US Eastern = 00:00/01:00 UTC), so each run sees the newest batch.
    # The fetch looks back 7 days, so a missed or failed day is picked up later.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill from this date, YYYY-MM-DD (empty = the usual last 7 days)'
        type: string
        default: ''
      until:
        description: 'Backfill up to this date, YYYY-MM-DD (empty = today)'
        type: string
        default: ''
      library:
        description: 'Also refresh this year''s top-venue accepted lists and add missed papers (runs by itself on the 1st of each month)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: radar-data
  cancel-in-progress: false

env:
  # Repository variable, e.g. "Barca21412/FinPaperRadar". Empty = skip Hugging Face.
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  RADAR_RELEASE_TAG: radar-data

jobs:
  build:
    runs-on: ubuntu-latest
    # Backfill runs (inputs.since) tag and embed ~1,500 new papers per half month.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/arxiv_radar/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r scripts/arxiv_radar/requirements.txt
          npm ci

      - name: Restore full history
        run: npm run arxiv:restore

      # S11: on the 1st of each month (or on request), re-read this year's accepted
      # lists of the top venues; conferences publish them at different times.
      - name: Monthly top-venue library refresh
        id: library
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.library }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${FORCE}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            python -m scripts.arxiv_radar.venue_library fetch --since "$(date -u +%Y)" || echo "::warning title=Venue library::some venue-years failed; see the log"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and tag new arXiv papers
        env:
          # Any OpenAI-compatible endpoint. Defaults to DeepSeek; override with
          # repository variables LLM_BASE_URL / LLM_MODEL (e.g. DashScope + qwen).
          # Backfill window (workflow_dispatch only); empty on scheduled runs.
          RADAR_FETCH_SINCE: ${{ inputs.since }}
          RADAR_FETCH_UNTIL: ${{ inputs.until }}
          # Backfills bring thousands of new papers at once; clean up affiliations faster.
          RADAR_AFFILIATION_LLM_CONCURRENCY: ${{ inputs.since != '' && '8' || '2' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Optional; OpenAlex lookups (institutions, venue library) work without it.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          # Optional secret: keyed fingerprints of authors' e-mails (to tell people with
          # the same name apart). Without it e-mails are not used at all.
          RADAR_ID_SALT: ${{ secrets.RADAR_ID_SALT }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: npm run arxiv:fetch

      - name: Add papers the radar missed (from this year's accepted lists)
        if: steps.library.outputs.run == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m scripts.arxiv_radar.discover --since-year "$(date -u +%Y)"

      # NBER working papers of the last ~5 weeks (the seen-list is not kept between runs,
      # so a short window keeps the daily reading to ~100 pages, 1 s apart).
      - name: Add new NBER working papers
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m scripts.arxiv_radar.nber --since "$(date -u -d '35 days ago' +%Y-%m-%d)" || echo "::warning title=NBER::NBER step failed; see the log"

      - name: Update embeddings (incremental)
        env:
          # Only new or changed papers; old stale vectors are not refreshed (2026-11-15).
          RADAR_EMBED_REFRESH_LIMIT: '0'
        run: npm run arxiv:embeddings

      - name: Export full history as Parquet
        run: npm run arxiv:export

      - name: Keep the export for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: radar-export
          path: data/export/
          retention-days: 7

      - name: Keep stats for the README job
        uses: actions/upload-artifact@v4
        with:
          name: radar-stats
          path: data/stats.json
          retention-days: 7

  publish-data:
    # The next run restores from whichever copy is newest available; FETCH_DAYS=7 covers gaps.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release mirror
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/arxiv_radar/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/arxiv_radar/requirements.txt

      - name: Download export
        uses: actions/download-artifact@v4
        with:
          name: radar-export
          path: data/export/

      # Release first, Hugging Face second; each runs even if the other failed,
      # and the job still turns red if either one did.
      - name: Mirror to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RADAR_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RADAR_RELEASE_TAG}" \
              --title "arXiv Radar data" \
              --notes "Full arXiv Radar history (Parquet), refreshed by the daily workflow. Thank you to arXiv for use of its open access interoperability." \
              --latest=false
          fi
          gh release upload "${RADAR_RELEASE_TAG}" data/export/* --clobber

      - name: Push to Hugging Face dataset
        if: ${{ !cancelled() }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m scripts.arxiv_radar.data_store push-hf

  deploy-site:
    # Rebuild the site from the data just published. Runs even if one of the two
    # copies failed to upload: restore then uses whichever copy is newest.
    needs: publish-data
    if: ${{ !cancelled() && needs.publish-data.result != 'skipped' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    with:
      ref: main

  commit-readme:
    # Only after the new data is published and the site is live, so the README never
    # advertises numbers the site does not show.
    needs: [publish-data, deploy-site]
    if: needs.publish-data.result == 'success' && needs.deploy-site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download stats
        uses: actions/download-artifact@v4
        with:
          name: radar-stats
          path: data/

      - name: Commit README status to main
        shell: bash
        run: |
          node scripts/arxiv_radar/update_readme.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/
          if git diff --cached --quiet; then
            echo "README status is already current."
            exit 0
          fi
          git commit -m "docs: sync arXiv radar README status ($(date -u +'%Y-%m-%d'))"
          git pull --rebase origin main
          git push origin HEAD:main

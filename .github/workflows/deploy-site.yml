name: Site build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/arxiv_radar/**'
      - 'scripts/site/**'
      - '资料/**'
      - '论文/**'
      - 'data/registry/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch to build'
        type: string
        default: main
    secrets:
      DEPLOY_SSH_KEY:
        # Optional at workflow entry: a missing key fails only deploy-server,
        # while the independent GitHub Pages deployment remains available.
        required: false

permissions:
  contents: read

# Serialize the complete build + both deployments, including reusable calls.
concurrency:
  group: site-release
  cancel-in-progress: false

env:
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
  RADAR_RELEASE_TAG: radar-data
  SITE_URL: https://quant.hfthnu.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_ref: ${{ steps.source.outputs.ref }}
      artifact_name: ${{ steps.source.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          filter: blob:none
      - name: Record checked-out revision
        id: source
        run: |
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "artifact=quant-site-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/arxiv_radar/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r scripts/arxiv_radar/requirements.txt
          npm ci
      - name: Restore full history once
        run: npm run arxiv:restore
      - name: Load stored embeddings
        env:
          RADAR_EMBED_REFRESH_LIMIT: '0'
        run: npm run arxiv:embeddings
      - name: Build public site data
        run: npm run arxiv:site-data
      - name: Cache verified search assets
        uses: actions/cache@v4
        with:
          path: docs/public/models
          key: search-assets-${{ hashFiles('scripts/site/search_model.json', 'package-lock.json') }}
      - name: Build and verify both site paths
        env:
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          BAIDU_SITE_VERIFICATION: ${{ vars.BAIDU_SITE_VERIFICATION }}
          # Public Umami website IDs (analysis.hfthnu.com); unset = build without tracking.
          UMAMI_WEBSITE_ID_MAIN: ${{ vars.UMAMI_WEBSITE_ID_MAIN }}
          UMAMI_WEBSITE_ID_PAGES: ${{ vars.UMAMI_WEBSITE_ID_PAGES }}
          # Read-only token for the GitHub Star count (anonymous calls get rate-limited on shared runners).
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run docs:build:dual
      - name: Keep both builds for independent deployment and rollback
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: |
            .site-build/server
            .site-build/pages
          include-hidden-files: true
          retention-days: 30

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .site-build
      - name: Refuse an outdated Pages build
        run: python3 scripts/site/check_release_freshness.py .site-build/pages https://Barca0412.github.io/Introduction-to-Quantitative-Finance
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-build/pages
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .site-build
      - name: Refuse an outdated server build
        run: python3 scripts/site/check_release_freshness.py .site-build/server https://quant.hfthnu.com
      - name: Publish to the approved webroot and verify
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/site/deploy_server.sh .site-build/server

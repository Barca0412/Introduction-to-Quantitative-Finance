# Conferences and journals (design doc 4.3.6). Used to turn the venue an author wrote in
# the arXiv comment or journal_ref ("Accepted by KDD '23, ADS track") into
# {name, kind, discipline}. `match` is a regular expression searched case-insensitively
# in that text, in file order: put specific entries before broader ones (e.g. "ICLR
# workshop" is caught by the workshop rule in venues.py, not by a separate entry).
#
# discipline: cs | finance-econ | interdisciplinary | other
# kind: conference | journal (workshops and symposia are detected from the text)
# top: in the first top-venue list for the S11 accepted-paper library (user, 2026-11-15)
#
# First version 2026-11-15, written from general knowledge; extend from the weekly list
# of unmatched venue mentions.


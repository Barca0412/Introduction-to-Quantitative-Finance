# Standard keywords (S5, design doc 4.5). A keyword the LLM writes is lower-cased, its
# hyphens/slashes become spaces, then it is matched against `patterns` (regular
# expressions, searched in that text) in file order: put specific entries before broad
# ones. A match is replaced by the standard `en` name; no match keeps the cleaned text
# and is listed as a new term for the weekly review.
#
# First version 2026-11-15 from the 1,824 keywords of the 345 relevant November papers
# (1,626 distinct spellings). Edit freely: only S5 is re-run, no LLM call.

